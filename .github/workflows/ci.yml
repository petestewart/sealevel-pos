name: CI

# Automated checks for the monorepo (GH-95). Runs the parts that need no
# secrets: type-checking across all workspaces, building the core + worker
# packages, and the offline Gmail smoke suite. The console's `next build`
# is deliberately excluded here because it requires Clerk + database env
# that is not available to CI; its types are still covered by typecheck.

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger for the drafting evals: run the full golden-case suite
  # on demand (Actions tab -> CI -> Run workflow) without needing a PR
  # that touches a prompt-affecting path.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck + build + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (all workspaces)
        run: npm run typecheck

      - name: Build core + worker
        run: npm run build --workspace @ai-manager/core --workspace @ai-manager/worker

      - name: Gmail offline smoke suite
        run: npm run smoke:gmail --workspace @ai-manager/core

      - name: Email history tool offline smoke suite
        run: npm run smoke:emailhistory --workspace @ai-manager/core

      - name: Eval engine offline smoke suite
        run: npm run smoke:evals --workspace @ai-manager/core

      - name: KB write-back offline smoke suite
        run: npm run smoke:kbwriteback --workspace @ai-manager/core

      - name: Analytics client offline smoke suite
        run: npm run smoke:analytics --workspace @ai-manager/core

      - name: Contact sync offline smoke suite
        run: npm run smoke:synccontacts --workspace @ai-manager/core

      # The learning-loop smoke runs its offline half here (signal
      # extraction, digest, dedupe, mocked-model miner); the DB-backed SQL
      # guard half self-skips without DATABASE_URL and runs locally
      # against docker compose or an ephemeral Postgres 16.
      - name: Learning loop offline smoke suite
        run: npm run smoke:learning --workspace @ai-manager/core

  # Golden-case drafting evals (evals/cases). Live drafting costs real API
  # tokens, so this job only spends them when a prompt-affecting path
  # changed AND the ANTHROPIC_API_KEY secret is present; otherwise it
  # skips each gated step with a notice (same pattern as a token-gated
  # deploy). The deterministic tier alone is exercised for free in the
  # verify job's eval smoke suite above.
  drafting-evals:
    name: drafting evals (golden cases)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect prompt-affecting changes
        id: gate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # A manual dispatch is an explicit request to run the suite, so
          # the path gate is bypassed; PRs still only spend tokens when a
          # prompt-affecting path changed.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif base="${{ github.event.pull_request.base.sha }}" && \
            git diff --name-only "$base"...HEAD -- \
              packages/core/src/jobs/emailDraft.ts \
              packages/core/src/booking.ts \
              packages/core/src/tools/kb.ts \
              packages/core/src/tools/emailHistory.ts \
              packages/core/src/brain/prompts.ts \
              packages/core/src/evals \
              evals | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No prompt-affecting paths changed; skipping drafting evals."
          fi
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "key=true" >> "$GITHUB_OUTPUT"
          else
            echo "key=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Notice when API key is absent
        if: steps.gate.outputs.changed == 'true' && steps.gate.outputs.key != 'true'
        run: echo "::notice::Prompt-affecting paths changed but ANTHROPIC_API_KEY is not configured as a repo secret; skipping live drafting evals."

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.changed == 'true' && steps.gate.outputs.key == 'true'
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: steps.gate.outputs.changed == 'true' && steps.gate.outputs.key == 'true'
        run: npm ci

      # Cached outputs are gitignored, so this is a no-op in CI today; it
      # is kept so a future decision to commit outputs (or restore them
      # from a cache) gets free deterministic re-verification.
      - name: Offline deterministic checks (cached outputs)
        if: steps.gate.outputs.changed == 'true' && steps.gate.outputs.key == 'true'
        run: |
          if ls evals/outputs/*.json >/dev/null 2>&1; then
            npm run eval -- --offline
          else
            echo "No cached eval outputs present; skipping offline pass."
          fi

      - name: Run drafting evals
        if: steps.gate.outputs.changed == 'true' && steps.gate.outputs.key == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run eval
