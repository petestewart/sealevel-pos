name: CI

# Automated checks for the monorepo (GH-95). Runs the parts that need no
# secrets: type-checking across all workspaces, building the core + worker
# packages, and the offline Gmail smoke suite. The console's `next build`
# is deliberately excluded here because it requires Clerk + database env
# that is not available to CI; its types are still covered by typecheck.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck + build + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (all workspaces)
        run: npm run typecheck

      - name: Build core + worker
        run: npm run build --workspace @ai-manager/core --workspace @ai-manager/worker

      - name: Gmail offline smoke suite
        run: npm run smoke:gmail --workspace @ai-manager/core
