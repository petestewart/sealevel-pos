<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; color: #1d1b18; }
    a { color: #a8512e; } a:hover { color: #8a3f20; }
  </style>
</helmet>
<div style="width: 760px; min-height: 540px; background: #f6f3ee; padding: 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 0">

  <div style="display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1.6fr) 150px; gap: 12px; align-items: center; min-height: 84px; padding: 10px 18px; border: 1px solid #e3ded6; border-radius: 14px; background: #ffffff; box-shadow: 0 1px 2px rgba(29, 27, 24, 0.05)">
    <div style="display: flex; align-items: center; gap: 12px; min-width: 0">
      <div style="flex: 0 0 auto; width: 44px; height: 44px; border-radius: 999px; background: #edeae3; color: #6d6659; display: flex; align-items: center; justify-content: center; font-weight: 700">CD</div>
      <div style="min-width: 0">
        <div style="font-size: 20px; font-weight: 600; white-space: nowrap">Colin Dennis</div>
        <div style="font-size: 16px; color: #6d6659">2 visits in the last month</div>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 6px; min-width: 0">
      <span style="min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">10 Class Card</span>
      <span style="flex: 0 0 auto; padding: 8px 12px; border-radius: 999px; background: #f3ece2; color: #a8512e; font-weight: 600">Change</span>
    </div>
    <div style="display: flex; justify-content: flex-end">
      <div style="min-width: 118px; min-height: 48px; border-radius: 999px; background: #a8512e; color: #ffffff; font-weight: 700; display: flex; align-items: center; justify-content: center">Check in</div>
    </div>
  </div>

  <div style="width: 420px; margin: 8px 0 0 320px; padding: 10px; border: 1px solid #e3ded6; border-radius: 14px; background: #ffffff; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25); display: flex; flex-direction: column; gap: 4px">
    <div style="padding: 4px 12px 8px; font-size: 16px; color: #6d6659">Which pass pays for this visit?</div>
    <div style="display: flex; align-items: center; gap: 10px; min-height: 64px; padding: 0 12px; border-radius: 10px; background: #f0f7f2">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0f7b4f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
      <span style="flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; color: #0f7b4f">10 Class Card</span>
      <span style="flex: 0 0 auto; color: #6d6659; font-size: 16px">9 left · exp 8/22/27</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; min-height: 64px; padding: 0 12px; border-radius: 10px">
      <span style="width: 20px"></span>
      <span style="flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">Personal Training</span>
      <span style="flex: 0 0 auto; color: #6d6659; font-size: 16px">exp 10/5/26</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; min-height: 64px; padding: 0 12px; border-radius: 10px">
      <span style="width: 20px"></span>
      <span style="flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">PT Package 5 Sessions</span>
      <span style="flex: 0 0 auto; color: #6d6659; font-size: 16px">5 left · exp 5/5/27</span>
    </div>
    <div style="margin: 4px 2px 2px; padding: 10px 12px; border-radius: 8px; background: #fdf1dc; color: #8a5a00; font-size: 16px">Dry run: the change was rehearsed, not sent.</div>
  </div>

</div>
</x-dc>
</body>
</html>
